<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password – Mudelli</title>

    <!--
        Google Fonts: Playfair Display is used for headings and branding.
        Plus Jakarta Sans is used for body text and input placeholders.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Bootstrap 5.3.3 — the main layout and utility library -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons 1.11.3 — icon font used across the site -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <!-- Site-wide stylesheet — defines shared colours, fonts, and global styles -->
    <link rel="stylesheet" href="css/style.css" />

    <style>
        /*
            Page-specific styles for forgot-password.html only.
            The layout mirrors login.html — a photograph fills the left half
            and the form sits on the right half.
        */


        /* ----------------------------------------------------------------
           SPLIT LAYOUT: the whole page fills the browser window height,
           divided into a left photo panel and a right form panel.
        ---------------------------------------------------------------- */

        /*
            Makes the row reach the bottom of the screen on all screen sizes.
        */
        .fp-row {
            min-height: 100vh;
        }


        /* ----------------------------------------------------------------
           LEFT PANEL: the model photograph and the MUDELLI branding
           that floats on top of it.
        ---------------------------------------------------------------- */

        .fp-panel-left {
            position: relative;   /* lets the image and overlay be positioned inside it */
            overflow: hidden;
            background-color: var(--mud-navy);
            min-height: 400px;    /* fallback height while the photo loads */
        }

        /*
            The photograph stretches to cover the entire left column —
            it crops as needed so no white space shows around it.
        */
        .fp-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        /*
            A semi-transparent dark layer that sits between the photo and
            the brand text, making the gold text easy to read.
        */
        .fp-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(30, 45, 77, 0.50) 0%,
                rgba(30, 45, 77, 0.30) 100%
            );
        }

        /*
            The MUDELLI logo and tagline positioned near the bottom of
            the left panel, centred horizontally.
        */
        .fp-brand {
            position: absolute;
            bottom: 64px;
            left: 0;
            right: 0;
            text-align: center;
            padding: 0 32px;
        }

        /*
            The large MUDELLI brand name shown over the photograph.
        */
        .fp-mudelli-logo {
            font-family: var(--font-display);
            font-size: 128px;
            font-weight: 700;
            color: var(--mud-gold);
            line-height: 1;
            letter-spacing: 0.04em;
            margin-bottom: 16px;
        }

        /*
            The italic tagline below the brand name.
        */
        .fp-tagline {
            font-family: var(--font-display);
            font-size: 30px;
            font-weight: 600;
            font-style: italic;
            color: var(--mud-gold);
            line-height: 1.3;
            margin: 0;
        }


        /* ----------------------------------------------------------------
           RIGHT PANEL: white column that holds the forgot-password form.
        ---------------------------------------------------------------- */

        /*
            The right panel centres the form box both horizontally and
            vertically, and scrolls if the content is taller than the screen.
        */
        .fp-panel-right {
            background-color: var(--mud-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 48px;
            overflow-y: auto;
        }

        /*
            The inner box that wraps all the form content.
            max-width stops it from stretching too wide on large screens.
        */
        .fp-form-box {
            width: 100%;
            max-width: 480px;
        }


        /* ----------------------------------------------------------------
           FORM CONTENT: heading, input, button, and navigation links.
        ---------------------------------------------------------------- */

        /*
            A small uppercase label above the main heading that tells the
            user which part of the site they are on.
        */
        .fp-page-label {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 500;
            color: #A6A3A3;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        /*
            The main heading — taken from the Figma design.
            Tells the user exactly what to do on this page.
        */
        .fp-heading {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 400;
            color: var(--mud-gold);
            line-height: 1.35;
            margin-bottom: 36px;
        }

        /*
            Wrapper around each label and input — adds space below the field.
        */
        .fp-field {
            margin-bottom: 24px;
        }

        /*
            The text label above the email input box.
        */
        .fp-label {
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 500;
            color: #000000;
            display: block;
            margin-bottom: 6px;
        }

        /*
            The email input box — grey background, no visible border until
            the user clicks into it, then a gold underline appears.
        */
        .fp-input {
            width: 100%;
            height: 44px;
            background-color: #F4F4F4;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 8px 12px;
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--mud-navy);
            transition: border-color 0.2s;
        }
        .fp-input::placeholder {
            font-family: var(--font-body);
            font-size: 13px;
            color: #A6A3A3;
        }
        .fp-input:focus {
            outline: none;
            border-bottom-color: var(--mud-gold);
        }

        /*
            The Reset Password submit button — full-width gold bar,
            matching the Login and Create Account buttons on login.html.
        */
        .btn-fp-submit {
            display: block;
            width: 100%;
            background-color: var(--mud-gold);
            color: var(--mud-mid-blue);
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            padding: 20px 16px;
            border: none;
            border-radius: 0;
            text-align: center;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: background-color 0.2s, color 0.2s;
        }
        .btn-fp-submit:hover,
        .btn-fp-submit:focus {
            background-color: var(--mud-navy);
            color: var(--mud-gold);
            outline: none;
        }

        /*
            The "Back to Login" link below the submit button.
        */
        .fp-back {
            margin-top: 28px;
            text-align: center;
        }

        .fp-back-link {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 500;
            color: var(--mud-navy);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .fp-back-link:hover,
        .fp-back-link:focus {
            color: var(--mud-gold);
        }


        /* ----------------------------------------------------------------
           SUCCESS STATE: replaces the form after the user submits.
           Hidden by default — JavaScript makes it visible on submit.
        ---------------------------------------------------------------- */

        .fp-success {
            display: none;
            text-align: center;
        }

        /*
            The large envelope-check icon that confirms the email was sent.
        */
        .fp-success-icon {
            font-size: 56px;
            color: var(--mud-gold);
            display: block;
            margin-bottom: 20px;
        }

        /*
            The bold confirmation heading inside the success message.
        */
        .fp-success-title {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            color: var(--mud-navy);
            margin-bottom: 12px;
        }

        /*
            The smaller explanation text below the success heading.
        */
        .fp-success-text {
            font-family: var(--font-body);
            font-size: 15px;
            color: #555;
            line-height: 1.7;
            margin-bottom: 32px;
        }


        /* ----------------------------------------------------------------
           RESPONSIVE: the photo panel hides on smaller screens so the
           form fills the full page width instead.
        ---------------------------------------------------------------- */

        @media (max-width: 991.98px) {
            .fp-panel-left {
                display: none;
            }
            .fp-panel-right {
                padding: 48px 32px;
            }
        }

        @media (max-width: 575.98px) {
            .fp-panel-right {
                padding: 32px 16px;
            }
            .fp-heading {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

<!--
    Skip link — lets keyboard users jump straight to the form
    without tabbing through anything else first.
-->
<a class="skip-link" href="#main-content">Skip to main content</a>

<!--
    Main content — the full-page split layout.
    No navbar or footer on this page.
-->
<main id="main-content">
    <div class="container-fluid g-0">
        <div class="row g-0 fp-row">

            <!--
                LEFT PANEL
                The model photograph covers this entire column.
                The MUDELLI logo and tagline float on top of the image.
                aria-hidden="true" tells screen readers to skip this panel
                because it is purely decorative.
            -->
            <div class="col-lg-7 fp-panel-left" aria-hidden="true">

                <!-- The model photograph — empty alt because it is decorative -->
                <img
                    src="images/forgot-password.jpg"
                    alt=""
                    role="presentation"
                    class="fp-bg-img"
                />

            </div>


            <!--
                RIGHT PANEL
                The forgot-password form sits here on a white background.
            -->
            <div class="col-lg-5 fp-panel-right">
                <div class="fp-form-box">

                    <!--
                        FORM STATE
                        This is the default view — the email field and submit button.
                        JavaScript hides this and shows the success message
                        once the form is submitted.
                    -->
                    <div id="fp-form-state">

                        <!-- Small label identifying this as the account recovery page -->
                        <p class="fp-page-label">Account Recovery</p>

                        <!-- Main heading taken directly from the Figma design -->
                        <h1 class="fp-heading">Enter your email to reset your password</h1>

                        <!--
                            The forgot-password form.
                            action="#" is used because this is a front-end only demo.
                            novalidate lets the page handle validation without browser popups.
                        -->
                        <form action="#" method="post" novalidate id="fp-form">

                            <!--
                                Email Address — the only field on this form.
                                The user enters the email linked to their Mudelli account.
                            -->
                            <div class="fp-field">
                                <label class="fp-label" for="fp-email">Email Address</label>
                                <input
                                    class="fp-input"
                                    type="email"
                                    id="fp-email"
                                    name="email"
                                    placeholder="Email address"
                                    autocomplete="email"
                                    required
                                />
                            </div>

                            <!-- Submit button — sends the password reset request -->
                            <button type="submit" class="btn-fp-submit">Reset Password</button>

                        </form>

                        <!--
                            Back to Login link — lets the user go back if they
                            remembered their password or want to log in instead.
                        -->
                        <p class="fp-back">
                            <a href="login.html" class="fp-back-link">
                                <i class="bi bi-arrow-left" aria-hidden="true"></i>
                                Back to Login
                            </a>
                        </p>

                    </div>


                    <!--
                        SUCCESS STATE
                        Hidden by default — appears after the user submits the form.
                        aria-live="polite" tells screen readers to announce this
                        content when it becomes visible.
                    -->
                    <div id="fp-success-state" class="fp-success" aria-live="polite">

                        <!-- Large envelope icon to reinforce the "check your email" message -->
                        <i class="bi bi-envelope-check fp-success-icon" aria-hidden="true"></i>

                        <!-- Success heading -->
                        <p class="fp-success-title">Check your inbox</p>

                        <!-- Short explanation of what happens next -->
                        <p class="fp-success-text">
                            If an account with that email address exists, we have sent
                            a password reset link. Please check your inbox and follow
                            the instructions in the email.
                        </p>

                        <!-- Link back to the login page once the user is ready -->
                        <a href="login.html" class="fp-back-link" style="justify-content: center;">
                            <i class="bi bi-arrow-left" aria-hidden="true"></i>
                            Back to Login
                        </a>

                    </div>

                </div>
            </div>

        </div>
    </div>
</main>

<!-- Bootstrap 5.3.3 JavaScript bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    /*
        Forgot-password form script.

        When the user submits the form, this script:
        1. Stops the browser from refreshing the page.
        2. Checks that the email field is not empty.
        3. Hides the form and shows a success confirmation message instead.

        No real server request is made — this is a front-end only demo page.
    */

    const fpForm         = document.getElementById('fp-form');
    const fpFormState    = document.getElementById('fp-form-state');
    const fpSuccessState = document.getElementById('fp-success-state');
    const fpEmailInput   = document.getElementById('fp-email');

    fpForm.addEventListener('submit', function (e) {
        /* Stop the browser from navigating away or reloading the page */
        e.preventDefault();

        /* Only continue if the user has typed something in the email field */
        if (!fpEmailInput.value.trim()) {
            fpEmailInput.focus();
            return;
        }

        /* Hide the form and show the success confirmation message */
        fpFormState.style.display = 'none';
        fpSuccessState.style.display = 'block';
    });
</script>

</body>
</html>
