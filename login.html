<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – Mudelli</title>

    <!--
        Google Fonts: Playfair Display is used for headings and branding.
        Plus Jakarta Sans is used for body text and input placeholders.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Bootstrap 5.3.3 — the main layout and utility library -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons 1.11.3 — icon font used across the site -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

    <!-- Site-wide stylesheet — defines shared colours, fonts, and global styles -->
    <link rel="stylesheet" href="css/style.css" />

    <style>


        /* ----------------------------------------------------------------
           SPLIT LAYOUT: the whole page is divided into two side-by-side
           panels — the photo on the left and the form on the right.
        ---------------------------------------------------------------- */

        /*
            Makes the row fill the full height of the browser window
            so both panels stretch to the bottom of the screen.
        */
        .lg-row {
            min-height: 100vh;
        }


        /* ----------------------------------------------------------------
           LEFT PANEL: holds the full-bleed model photograph.
           The photo is positioned to cover the entire column,
           with the MUDELLI logo and tagline floating on top.
        ---------------------------------------------------------------- */

        .lg-panel-left {
            position: relative;   /* needed so the image and overlay can be positioned inside it */
            overflow: hidden;
            background-color: var(--mud-navy);
            min-height: 400px;    /* fallback height before image loads */
        }

        /*
            The model photograph stretches to fill the entire left column,
            cropping as needed to cover all the space (like a background image).
        */
        .lg-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
        }

        

        /*
            MUDELLI logo and tagline.
            It is positioned near the bottom of the left panel.
        */
        .lg-brand {
            position: absolute;
            bottom: 300px;
            left: 0;
            right: 0;
            text-align: center;
            padding: 0 32px;
        }

        /*
            The large MUDELLI logo displayed over the photo.
        */
        .lg-mudelli-logo {
            font-family: var(--font-display);
            font-size: 128px;
            font-weight: 700;
            color: var(--mud-gold);
            line-height: 1;
            letter-spacing: 0.04em;
            margin-bottom: 16px;
        }

        /*
            The italic tagline below the logo.
        */
        .lg-tagline {
            font-family: var(--font-display);
            font-size: 30px;
            font-weight: 600;
            font-style: italic;
            color: var(--mud-gold);
            line-height: 1.3;
            margin: 0;
        }


        /* ----------------------------------------------------------------
           RIGHT PANEL: white column that holds the tab bar and forms.
        ---------------------------------------------------------------- */

        /*
            The right panel centres the form box both horizontally and vertically.
            It scrolls if the register form is taller than the screen.
        */
        .lg-panel-right {
            background-color: var(--mud-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 48px;
            overflow-y: auto;
        }

        /*
            The inner box that wraps the tab bar and whichever form is active.
            max-width keeps it from stretching too wide on large screens.
        */
        .lg-form-box {
            width: 100%;
            max-width: 480px;
        }


        /* ----------------------------------------------------------------
           TAB BAR: the two buttons at the top that switch between
           the Login form and the Create an Account form.
        ---------------------------------------------------------------- */

        /*
            The cream bar that holds the two tab buttons.
        */
        .lg-tab-bar {
            display: flex;
            align-items: center;
            background-color: var(--mud-cream);
            padding: 7px;
            border-radius: 8px;
            margin-bottom: 36px;
            gap: 4px;
        }

        /*
            Each tab button — both start with the same basic look.
        */
        .lg-tab {
            flex: 1;
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 400;
            color: var(--mud-gold);
            background: transparent;
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
            text-align: center;
            line-height: 1.3;
        }

        /*
            The active tab gets a white background and bold text
            so it is clear which form is currently open.
        */
        .lg-tab.active {
            background-color: var(--mud-white);
            font-weight: 700;
            box-shadow: 0 1px 6px rgba(30, 45, 77, 0.12);
        }

        .lg-tab:hover {
            background-color: rgba(255, 255, 255, 0.6);
        }

        .lg-tab:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
        }


        /* ----------------------------------------------------------------
           FORM PANELS: each form (Login / Register) is in its own panel.
           Only one is visible at a time.
        ---------------------------------------------------------------- */

        /*
            Hides whichever form panel is not currently active.
        */
        .lg-panel-hidden {
            display: none;
        }


        /* ----------------------------------------------------------------
           SHARED FORM STYLES: labels, inputs, prompts, and buttons
           used in both the Login and Register forms.
        ---------------------------------------------------------------- */

        /*
            The small text at the top of each form, e.g. "Not a member yet?".
        */
        .lg-prompt {
            font-family: var(--font-display);
            font-size: 13px;
            color: #000000;
            margin-bottom: 28px;
        }

        /*
            The clickable link inside the prompt, e.g. "Register Now" or "Log in".
            Underlined so users know it is clickable.
        */
        .lg-prompt a {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 700;
            color: #000000;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .lg-prompt a:hover,
        .lg-prompt a:focus {
            color: var(--mud-gold);
        }

        /*
            Wrapper around each label + input pair — adds space between fields.
        */
        .lg-field {
            margin-bottom: 20px;
        }

        /*
            The text label above each input box.
        */
        .lg-label {
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 500;
            color: #000000;
            display: block;
            margin-bottom: 6px;
        }

        /*
            The text input boxes — grey background, no border until focused.
            A gold underline appears when the field is clicked.
        */
        .lg-input {
            width: 100%;
            height: 44px;
            background-color: #F4F4F4;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 8px 12px;
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--mud-navy);
            transition: border-color 0.2s;
        }
        .lg-input::placeholder {
            font-family: var(--font-body);
            font-size: 13px;
            color: #A6A3A3;
        }
        .lg-input:focus {
            outline: none;
            border-bottom-color: var(--mud-gold);
        }

        /*
            The "Forgot Password?" link — gold, underlined, right-aligned.
        */
        .lg-forgot {
            display: block;
            font-family: var(--font-display);
            font-size: 13px;
            color: var(--mud-gold);
            text-decoration: underline;
            text-underline-offset: 2px;
            text-align: right;
            margin-bottom: 28px;
        }
        .lg-forgot:hover,
        .lg-forgot:focus {
            color: var(--mud-navy);
        }

        /*
            The main action button — full-width gold bar at the bottom of each form.
            Used for both "Login" and "Create Account".
        */
        .btn-lg-submit {
            display: block;
            width: 100%;
            background-color: var(--mud-gold);
            color: var(--mud-mid-blue);
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            padding: 20px 16px;
            border: none;
            border-radius: 0;
            text-align: center;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: background-color 0.2s, color 0.2s;
        }
        .btn-lg-submit:hover,
        .btn-lg-submit:focus {
            background-color: var(--mud-navy);
            color: var(--mud-gold);
            outline: none;
        }


        /* ----------------------------------------------------------------
           REGISTER FORM EXTRAS: role radio buttons and terms checkbox.
        ---------------------------------------------------------------- */

        /*
            The fieldset that groups the role radio buttons together.
            The browser's default border is removed.
        */
        .lg-role-fieldset {
            border: none;
            padding: 0;
            margin: 0 0 4px 0;
        }

        /*
            The "I am a *" 
        */
        .lg-role-legend {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 12px;
            float: left;
            width: 100%;
            padding: 0;
        }

        /*
            Each row containing one radio button and its label.
        */
        .lg-role-option {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        /*
            The radio button — accent-color makes it match the brand gold colour.
        */
        .lg-radio {
            width: 18px;
            height: 18px;
            accent-color: var(--mud-gold);
            flex-shrink: 0;
            cursor: pointer;
        }

        /*
            The text label next to each radio button.
        */
        .lg-role-label {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 400;
            color: #000000;
            cursor: pointer;
            margin: 0;
        }

        /*
            The terms and conditions row — checkbox on the left, text on the right.
        */
        .lg-terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 28px;
        }

        /*
            The checkbox before the terms text.
        */
        .lg-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--mud-gold);
            flex-shrink: 0;
            margin-top: 2px;
            cursor: pointer;
        }

        /*
            The terms and conditions text — bold to draw attention to the agreement.
        */
        .lg-terms-text {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 700;
            color: #000000;
            margin: 0;
        }
        .lg-terms-text a {
            color: var(--mud-gold);
            text-underline-offset: 2px;
        }
        .lg-terms-text a:hover {
            color: var(--mud-navy);
        }


        /* ----------------------------------------------------------------
           RESPONSIVE: on smaller screens the photo panel hides and
           the form takes up the full width.
        ---------------------------------------------------------------- */

        @media (max-width: 991.98px) {
            .lg-panel-left {
                display: none;
            }
            .lg-panel-right {
                padding: 48px 32px;
            }
        }

        @media (max-width: 575.98px) {
            .lg-panel-right {
                padding: 32px 16px;
            }
            .lg-tab {
                font-size: 16px;
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>

<!--
    Skip link — lets keyboard users jump straight to the form
    without tabbing through anything else first.
-->
<a class="skip-link" href="#main-content">Skip to main content</a>

<!--
    Main content — the full-page split layout.
    No navbar or footer on this page.
-->
<main id="main-content">
    <div class="container-fluid g-0">
        <div class="row g-0 lg-row">

            <!--
                LEFT PANEL
                The model photograph fills this column.
                The MUDELLI logo and tagline are displayed on top of it.
                aria-hidden="true" hides this decorative panel from screen readers
                since it contains no meaningful content for them.
            -->
            <div class="col-lg-7 lg-panel-left" aria-hidden="true">

                <!-- The model photograph — role="presentation" means screen readers skip it -->
                <img
                    src="images/login.jpg"
                    alt=""
                    role="presentation"
                    class="lg-bg-img"
                />

                <!-- Dark layer over the photo so the text is easy to read -->
                <div class="lg-overlay"></div>

                <!-- MUDELLI logo and tagline floating over the photo -->
                <div class="lg-brand">
                    <p class="lg-mudelli-logo">MUDELLI</p>
                    <p class="lg-tagline">Your gateway to modeling opportunities</p>
                </div>
            </div>


            <!--
                RIGHT PANEL
                The login and register forms live here on a white background.
            -->
            <div class="col-lg-5 lg-panel-right">
                <div class="lg-form-box">

                    <!--
                        TAB BAR
                        Two buttons that switch between the Login and Register forms.
                        The active button gets a white background and bold text.
                        role="tablist" tells screen readers this is a set of tab buttons.
                    -->
                    <div class="lg-tab-bar" role="tablist" aria-label="Account forms">
                        <button
                            class="lg-tab active"
                            id="tab-login"
                            role="tab"
                            aria-selected="true"
                            aria-controls="panel-login"
                            type="button"
                        >
                            Login
                        </button>
                        <button
                            class="lg-tab"
                            id="tab-register"
                            role="tab"
                            aria-selected="false"
                            aria-controls="panel-register"
                            type="button"
                        >
                            Create an Account
                        </button>
                    </div>


                    <!--
                        LOGIN FORM PANEL
                        Shown when the Login tab is active.
                        role="tabpanel" links this panel to the tab bar above.
                    -->
                    <div id="panel-login" role="tabpanel" aria-labelledby="tab-login">

                        <!-- Small prompt with a link to switch to the Register form -->
                        <p class="lg-prompt">
                            Not a member yet?
                            <a href="#register" id="link-to-register">Register Now</a>
                        </p>

                        <!--
                            Login form — no real server action on this demo page.
                            novalidate allows custom validation styling if needed.
                        -->
                        <form action="#" method="post" novalidate>

                            <!--
                                Email Address field
                            -->
                            <div class="lg-field">
                                <label class="lg-label" for="login-email">Email Address</label>
                                <input
                                    class="lg-input"
                                    type="email"
                                    id="login-email"
                                    name="email"
                                    placeholder="Email address"
                                    autocomplete="email"
                                    required
                                />
                            </div>

                            <!--
                                Password field
                            -->
                            <div class="lg-field">
                                <label class="lg-label" for="login-password">Password</label>
                                <input
                                    class="lg-input"
                                    type="password"
                                    id="login-password"
                                    name="password"
                                    placeholder="Password"
                                    autocomplete="current-password"
                                    required
                                />
                            </div>

                            <!-- Forgot Password link — sits below the password field -->
                            <a href="forgot-password.html" class="lg-forgot">Forgot Password?</a>

                            <!-- Login submit button -->
                            <button type="submit" class="btn-lg-submit">Login</button>

                        </form>
                    </div>


                    <!--
                        REGISTER FORM PANEL
                        Hidden by default — shown when "Create an Account" tab is active.
                        Also opens automatically if the page URL includes #register.
                    -->
                    <div id="panel-register" role="tabpanel" aria-labelledby="tab-register" class="lg-panel-hidden">

                        <!-- Small prompt with a link to switch back to Login -->
                        <p class="lg-prompt">
                            Already have an account?
                            <a href="#" id="link-to-login">Log in</a>
                        </p>

                        <!--
                            Register form — collects the details needed to create a new account.
                        -->
                        <form action="#" method="post" novalidate>

                            <!--
                                First Name field
                            -->
                            <div class="lg-field">
                                <label class="lg-label" for="reg-first-name">First Name</label>
                                <input
                                    class="lg-input"
                                    type="text"
                                    id="reg-first-name"
                                    name="first_name"
                                    placeholder="First name"
                                    autocomplete="given-name"
                                    required
                                />
                            </div>

                            <!--
                                Last Name field
                            -->
                            <div class="lg-field">
                                <label class="lg-label" for="reg-last-name">Last Name</label>
                                <input
                                    class="lg-input"
                                    type="text"
                                    id="reg-last-name"
                                    name="last_name"
                                    placeholder="Last name"
                                    autocomplete="family-name"
                                    required
                                />
                            </div>

                            <!--
                                Email Address field
                            -->
                            <div class="lg-field">
                                <label class="lg-label" for="reg-email">Email Address</label>
                                <input
                                    class="lg-input"
                                    type="email"
                                    id="reg-email"
                                    name="email"
                                    placeholder="Email address"
                                    autocomplete="email"
                                    required
                                />
                            </div>

                            <!--
                                Password field
                            -->
                            <div class="lg-field">
                                <label class="lg-label" for="reg-password">Password</label>
                                <input
                                    class="lg-input"
                                    type="password"
                                    id="reg-password"
                                    name="password"
                                    placeholder="Password"
                                    autocomplete="new-password"
                                    required
                                />
                            </div>

                            <!--
                                Confirm Password field — the user types their password again
                                to make sure they did not make a typo.
                            -->
                            <div class="lg-field">
                                <label class="lg-label" for="reg-confirm-password">Confirm Password</label>
                                <input
                                    class="lg-input"
                                    type="password"
                                    id="reg-confirm-password"
                                    name="confirm_password"
                                    placeholder="Confirm password"
                                    autocomplete="new-password"
                                    required
                                />
                            </div>

                            <!--
                                Role selection — radio buttons so the user picks one role.
                                fieldset groups the options together for screen readers.
                                legend is the heading for the group.
                            -->
                            <fieldset class="lg-role-fieldset">
                                <legend class="lg-role-legend">I am a *</legend>

                                <div class="lg-role-option">
                                    <input
                                        class="lg-radio"
                                        type="radio"
                                        id="role-model"
                                        name="role"
                                        value="model"
                                        required
                                    />
                                    <label class="lg-role-label" for="role-model">Model</label>
                                </div>

                                <div class="lg-role-option">
                                    <input
                                        class="lg-radio"
                                        type="radio"
                                        id="role-client"
                                        name="role"
                                        value="client"
                                    />
                                    <label class="lg-role-label" for="role-client">Client / Photographer / Brand</label>
                                </div>
                            </fieldset>

                            <!--
                                Terms and Conditions checkbox — the user must tick this
                                before they are allowed to submit the form.
                            -->
                            <div class="lg-terms">
                                <input
                                    class="lg-checkbox"
                                    type="checkbox"
                                    id="reg-terms"
                                    name="terms"
                                    required
                                />
                                <label class="lg-terms-text" for="reg-terms">
                                    I agree to the
                                    <a href="#">Terms &amp; Conditions</a>
                                    and
                                    <a href="#">Privacy Policy</a>.
                                </label>
                            </div>

                            <!-- Create Account submit button -->
                            <button type="submit" class="btn-lg-submit">Create Account</button>

                        </form>
                    </div>

                </div>
            </div>

        </div>
    </div>
</main>

<!-- Bootstrap 5.3.3 JavaScript bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    /*
        Tab switching script.

        This handles two things:
        1. Clicking the Login or Create an Account tab buttons switches the visible form.
        2. On page load, if the URL ends with #register, the Register form opens automatically.
    */

    /* Get references to the tab buttons */
    const tabLogin    = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');

    /* Get references to the two form panels */
    const panelLogin    = document.getElementById('panel-login');
    const panelRegister = document.getElementById('panel-register');

    /* Get references to the in-text switch links */
    const linkToRegister = document.getElementById('link-to-register');
    const linkToLogin    = document.getElementById('link-to-login');

    /* showLogin — activates the Login tab and hides the Register form */
    function showLogin() {
        /* Mark Login tab as active */
        tabLogin.classList.add('active');
        tabLogin.setAttribute('aria-selected', 'true');

        /* Mark Register tab as inactive */
        tabRegister.classList.remove('active');
        tabRegister.setAttribute('aria-selected', 'false');

        /* Show the Login form, hide the Register form */
        panelLogin.classList.remove('lg-panel-hidden');
        panelRegister.classList.add('lg-panel-hidden');

        /* Remove the #register hash from the URL so the address bar stays clean */
        history.replaceState(null, '', window.location.pathname);
    }

    /* showRegister — activates the Create an Account tab and hides the Login form */
    function showRegister() {
        /* Mark Register tab as active */
        tabRegister.classList.add('active');
        tabRegister.setAttribute('aria-selected', 'true');

        /* Mark Login tab as inactive */
        tabLogin.classList.remove('active');
        tabLogin.setAttribute('aria-selected', 'false');

        /* Show the Register form, hide the Login form */
        panelRegister.classList.remove('lg-panel-hidden');
        panelLogin.classList.add('lg-panel-hidden');

        /* Update the URL to include #register so linking directly to the register form works */
        history.replaceState(null, '', '#register');
    }

    /* Tab button click events */
    tabLogin.addEventListener('click', showLogin);
    tabRegister.addEventListener('click', showRegister);

    /* In-form switch link click events — prevents the page from jumping to the hash */
    linkToRegister.addEventListener('click', function (e) {
        e.preventDefault();
        showRegister();
    });

    linkToLogin.addEventListener('click', function (e) {
        e.preventDefault();
        showLogin();
    });

    /*
        Page load check — if the URL has #register at the end,
        open the Register tab immediately instead of the Login tab.
        This allows other pages to link directly to the register form
        by using href="login.html#register".
    */
    if (window.location.hash === '#register') {
        showRegister();
    }
</script>

</body>
</html>
